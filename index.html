<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>おこづかい管理</title>
<style>
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(135deg,#fff3b0,#c9f7ff,#ffd6e7);
  color:#222;
}
.wrap{
  padding:18px;
  max-width:900px;
  margin:auto;
}
h1{
  text-align:center;
  font-size:38px;
  color:#ff6b6b;
  margin:0 0 12px;
}
.top,.nav{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:12px 0;
}
button{
  border:0;
  border-radius:16px;
  padding:12px 20px;
  font-size:22px;
  font-weight:bold;
  background:#4dabf7;
  color:white;
}
.delete{background:#ff6b6b}
.card{
  background:white;
  border:5px solid #333;
  border-radius:24px;
  padding:18px;
}
.safe{border-color:#37b24d}
.warn{border-color:#f59f00}
.bad{
  border-color:#e03131;
  background:#fff0f0;
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
label{
  font-size:24px;
  font-weight:bold;
  white-space:nowrap;
}
input{
  width:100%;
  font-size:26px;
  padding:10px;
  border:3px solid #aaa;
  border-radius:12px;
}
input[type=number]{text-align:right}
.result{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:18px 0 8px;
}
.money{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  line-height:1.7;
}
.graph-title{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  margin-top:18px;
}
.graph{
  position:relative;
  height:56px;
  border:4px solid #333;
  border-radius:28px;
  background:#e9ecef;
  overflow:hidden;
  margin-top:10px;
}
.budget-bar{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:100%;
  background:#74c0fc;
}
.used-bar{
  position:absolute;
  left:0;
  top:8px;
  height:40px;
  width:0%;
  background:#ff6b6b;
  border-radius:20px;
  transition:.3s;
}
.graph-text{
  position:absolute;
  width:100%;
  text-align:center;
  line-height:56px;
  font-size:24px;
  font-weight:bold;
  z-index:2;
}
.scale{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  margin-top:6px;
}
.page{
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>おこづかい管理</h1>

  <div class="top">
    <button onclick="addPerson()">人を追加</button>
    <button class="delete" onclick="deletePerson()">この人を消す</button>
  </div>

  <div class="nav">
    <button onclick="prevPerson()">前へ</button>
    <div class="page" id="page"></div>
    <button onclick="nextPerson()">次へ</button>
  </div>

  <div id="area"></div>
</div>

<script>
let people = [];
let current = 0;

function yen(n){
  return Number(n || 0).toLocaleString() + "円";
}

function addPerson(){
  people.push({
    name: people.length + 1 + "人目",
    budget: 1000,
    items:[{name:"おかし", price:100}]
  });
  current = people.length - 1;
  render();
}

function deletePerson(){
  if(people.length <= 1) return;
  if(confirm("この人を消しますか？")){
    people.splice(current,1);
    if(current >= people.length) current = people.length - 1;
    render();
  }
}

function prevPerson(){
  if(current > 0){
    current--;
    render();
  }
}

function nextPerson(){
  if(current < people.length - 1){
    current++;
    render();
  }
}

function addItem(){
  people[current].items.push({name:"",price:0});
  render();
}

function deleteItem(i){
  people[current].items.splice(i,1);
  render();
}

function saveInput(){
  const p = people[current];
  p.name = document.getElementById("name").value;
  p.budget = Number(document.getElementById("budget").value || 0);

  p.items.forEach((item,i)=>{
    item.name = document.getElementById("itemName"+i).value;
    item.price = Number(document.getElementById("itemPrice"+i).value || 0);
  });
}

function update(){
  saveInput();
  render();
}

function render(){
  const p = people[current];
  document.getElementById("page").textContent =
    (current + 1) + " / " + people.length;

  let total = p.items.reduce((sum,item)=>sum + Number(item.price || 0),0);
  let remain = p.budget - total;

  let state = "safe";
  let message = "かえます ○";
  let color = "#2b8a3e";

  if(remain < 0){
    state = "bad";
    message = "かえません ❌";
    color = "#c92a2a";
  }else if(remain <= p.budget * 0.2){
    state = "warn";
    message = "あと少し！";
    color = "#e67700";
  }

  let percent = p.budget > 0 ? total / p.budget * 100 : 0;
  let barWidth = Math.min(percent,120);

  let itemsHtml = "";
  p.items.forEach((item,i)=>{
    itemsHtml += `
      <div class="row">
        <input id="itemName${i}" value="${item.name}" placeholder="買いたい物" oninput="update()">
        <input id="itemPrice${i}" type="number" value="${item.price}" oninput="update()">
        <label>円</label>
        <button class="delete" onclick="deleteItem(${i})">消す</button>
      </div>
    `;
  });

  document.getElementById("area").innerHTML = `
    <div class="card ${state}">
      <div class="row">
        <label>名前</label>
        <input id="name" value="${p.name}" oninput="update()">
      </div>

      <div class="row">
        <label>予算</label>
        <input id="budget" type="number" value="${p.budget}" oninput="update()">
        <label>円</label>
      </div>

      <h2>買いたい物</h2>
      ${itemsHtml}

      <button onclick="addItem()">買いたい物を追加</button>

      <div class="result" style="color:${color}">${message}</div>
      <div class="money">使う予定：${yen(total)}</div>
      <div class="money">
        ${remain >= 0 ? "のこり：" + yen(remain) : "たりない：" + yen(Math.abs(remain))}
      </div>

      <div class="graph-title">予算と使う予定</div>
      <div class="scale">
        <span>0円</span>
        <span>予算 ${yen(p.budget)}</span>
      </div>

      <div class="graph">
        <div class="budget-bar"></div>
        <div class="used-bar" style="width:${barWidth}%"></div>
        <div class="graph-text">${yen(total)}</div>
      </div>
    </div>
  `;
}

addPerson();
</script>
</body>
</html>
