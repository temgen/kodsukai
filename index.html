<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>おこづかい管理</title>
<style>
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(135deg,#fff3b0,#c9f7ff,#ffd6e7);
  color:#222;
}
.wrap{
  padding:18px;
  max-width:900px;
  margin:auto;
}
h1{
  text-align:center;
  font-size:38px;
  color:#ff6b6b;
  margin:0 0 12px;
}
.top{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:12px 0;
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0 14px;
}
.tab{
  flex:0 0 auto;
  background:#dee2e6;
  color:#222;
  box-shadow:none;
  border:3px solid #555;
}
.tab.active{
  background:#4dabf7;
  color:white;
  border-color:#1864ab;
}
button{
  border:0;
  border-radius:16px;
  padding:12px 20px;
  font-size:22px;
  font-weight:bold;
  background:#4dabf7;
  color:white;
}
.delete{background:#ff6b6b}
.card{
  background:white;
  border:5px solid #333;
  border-radius:24px;
  padding:18px;
}
.card.safe{border-color:#37b24d}
.card.warn{border-color:#f59f00}
.card.bad{
  border-color:#e03131;
  background:#fff0f0;
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
label{
  font-size:24px;
  font-weight:bold;
  white-space:nowrap;
}
input{
  width:100%;
  font-size:26px;
  padding:10px;
  border:3px solid #aaa;
  border-radius:12px;
}
input[type=number]{text-align:right}
h2{
  margin:12px 0;
  font-size:28px;
}
.result{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:18px 0 8px;
}
.money{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  line-height:1.7;
}
.graph-title{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  margin-top:18px;
}
.graph{
  position:relative;
  height:56px;
  border:4px solid #333;
  border-radius:28px;
  background:#e9ecef;
  overflow:hidden;
  margin-top:10px;
}
.budget-bar{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:100%;
  background:#74c0fc;
}
.used-bar{
  position:absolute;
  left:0;
  top:8px;
  height:40px;
  width:0%;
  background:#ff6b6b;
  border-radius:20px;
  transition:.15s;
}
.graph-text{
  position:absolute;
  width:100%;
  text-align:center;
  line-height:56px;
  font-size:24px;
  font-weight:bold;
  z-index:2;
}
.scale{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  margin-top:6px;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>おこづかい管理</h1>

  <div class="top">
    <button onclick="addPerson()">人を追加</button>
    <button class="delete" onclick="deletePerson()">この人を消す</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="area"></div>
</div>

<script>
let people = [];
let current = 0;

function yen(n){
  return Number(n || 0).toLocaleString() + "円";
}

function addPerson(){
  saveInputs();
  people.push({
    name: people.length + 1 + "人目",
    budget: 1000,
    items:[{name:"おかし", price:100}]
  });
  current = people.length - 1;
  renderCard();
}

function deletePerson(){
  if(people.length <= 1) return;
  if(confirm("この人を消しますか？")){
    people.splice(current,1);
    if(current >= people.length) current = people.length - 1;
    renderCard();
  }
}

function switchPerson(index){
  saveInputs();
  current = index;
  renderCard();
}

function addItem(){
  saveInputs();
  people[current].items.push({name:"",price:0});
  renderCard();
}

function deleteItem(i){
  saveInputs();
  people[current].items.splice(i,1);
  renderCard();
}

function saveInputs(){
  const p = people[current];
  if(!p) return;

  const name = document.getElementById("name");
  const budget = document.getElementById("budget");

  if(!name || !budget) return;

  p.name = name.value;
  p.budget = Number(budget.value || 0);

  p.items.forEach((item,i)=>{
    const itemName = document.getElementById("itemName"+i);
    const itemPrice = document.getElementById("itemPrice"+i);
    if(itemName) item.name = itemName.value;
    if(itemPrice) item.price = Number(itemPrice.value || 0);
  });
}

function updateOnly(){
  saveInputs();
  renderTabs();
  updateResult();
}

function renderTabs(){
  let html = "";
  people.forEach((p,i)=>{
    html += `
      <button class="tab ${i === current ? "active" : ""}" onclick="switchPerson(${i})">
        ${escapeHtml(p.name || (i + 1) + "人目")}
      </button>
    `;
  });
  document.getElementById("tabs").innerHTML = html;
}

function renderCard(){
  const p = people[current];

  renderTabs();

  let itemsHtml = "";
  p.items.forEach((item,i)=>{
    itemsHtml += `
      <div class="row item">
        <input id="itemName${i}" value="${escapeHtml(item.name)}" placeholder="買いたい物" oninput="updateOnly()">
        <input id="itemPrice${i}" type="number" value="${item.price}" oninput="updateOnly()">
        <label>円</label>
        <button class="delete" onclick="deleteItem(${i})">消す</button>
      </div>
    `;
  });

  document.getElementById("area").innerHTML = `
    <div class="card" id="card">
      <div class="row">
        <label>名前</label>
        <input id="name" value="${escapeHtml(p.name)}" oninput="updateOnly()">
      </div>

      <div class="row">
        <label>予算</label>
        <input id="budget" type="number" value="${p.budget}" oninput="updateOnly()">
        <label>円</label>
      </div>

      <h2>買いたい物</h2>
      <div id="items">${itemsHtml}</div>

      <button onclick="addItem()">買いたい物を追加</button>

      <div class="result" id="result"></div>
      <div class="money" id="total"></div>
      <div class="money" id="remain"></div>

      <div class="graph-title">予算と使う予定</div>
      <div class="scale">
        <span>0円</span>
        <span id="budgetLabel"></span>
      </div>

      <div class="graph">
        <div class="budget-bar"></div>
        <div class="used-bar" id="usedBar"></div>
        <div class="graph-text" id="graphText"></div>
      </div>
    </div>
  `;

  updateResult();
}

function updateResult(){
  const p = people[current];

  const total = p.items.reduce((sum,item)=>{
    return sum + Number(item.price || 0);
  },0);

  const remain = p.budget - total;

  const card = document.getElementById("card");
  const result = document.getElementById("result");
  const totalBox = document.getElementById("total");
  const remainBox = document.getElementById("remain");
  const usedBar = document.getElementById("usedBar");
  const graphText = document.getElementById("graphText");
  const budgetLabel = document.getElementById("budgetLabel");

  card.className = "card";

  let message = "かえます ○";
  let color = "#2b8a3e";

  if(remain < 0){
    card.classList.add("bad");
    message = "かえません ❌";
    color = "#c92a2a";
  }else if(p.budget > 0 && remain <= p.budget * 0.2){
    card.classList.add("warn");
    message = "あと少し！";
    color = "#e67700";
  }else{
    card.classList.add("safe");
  }

  result.textContent = message;
  result.style.color = color;

  totalBox.textContent = "使う予定：" + yen(total);
  remainBox.textContent =
    remain >= 0 ? "のこり：" + yen(remain) : "たりない：" + yen(Math.abs(remain));

  budgetLabel.textContent = "予算 " + yen(p.budget);

  let percent = p.budget > 0 ? total / p.budget * 100 : 0;
  usedBar.style.width = Math.min(percent,120) + "%";
  graphText.textContent = yen(total);
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

addPerson();
</script>
</body>
</html>
